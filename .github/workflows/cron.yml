name: Daily Job Scraper

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  scrape-ziprecruiter:
    name: ZipRecruiter Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run ZipRecruiter scraper
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: node ziprecruiter-scraper.js

      - name: Upload Excel report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZipRecruiter-Jobs-${{ github.run_id }}
          path: ZipRecruiter_Jobs.xlsx
          retention-days: 7
          if-no-files-found: warn